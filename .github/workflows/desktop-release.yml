name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z, greater than the previous channel version)
        required: true
        type: string
      environment:
        description: Release channel
        required: true
        type: choice
        options:
          - dev
          - production

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.release.outputs.environment }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          version="$MANUAL_VERSION"
          environment="$MANUAL_ENVIRONMENT"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$environment" =~ ^(dev|production)$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    environment: desktop-${{ needs.prepare.outputs.environment }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundle: appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle: nsis
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: app,dmg
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_BUNDLE: ${{ matrix.bundle }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      ZENTRA_DESKTOP_ENV: ${{ needs.prepare.outputs.environment }}
      ZENTRA_API_ORIGIN: ${{ needs.prepare.outputs.environment == 'dev' && (vars.ZENTRA_DEV_API_ORIGIN || 'https://precal.xyehr.cn') || (vars.ZENTRA_API_ORIGIN || 'https://calendar.xyehr.cn') }}
      ZENTRA_UPDATER_PUBLIC_KEY: ${{ vars.ZENTRA_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/calendar-client/src-tauri -> target
          key: ${{ matrix.target }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev desktop-file-utils xdg-utils
      - run: bun install --frozen-lockfile
      - name: Build signed updater and installer
        working-directory: apps/calendar-client
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/release-config.mjs
          bun run tauri build --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLE" --config src-tauri/tauri.release.conf.json
          node scripts/collect-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: apps/calendar-client/release-artifacts/*
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      ZENTRA_DESKTOP_ENV: ${{ needs.prepare.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts
      - run: node apps/calendar-client/scripts/publish-release.mjs release-artifacts
