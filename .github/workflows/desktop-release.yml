name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Dev release version (X.Y.Z, greater than the previous dev version)
        required: true
        type: string
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && 'dev' || 'production' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.release.outputs.environment }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="$MANUAL_VERSION"
            environment=dev
          else
            version="${GITHUB_REF_NAME#desktop-v}"
            environment=production
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    environment: desktop-${{ needs.prepare.outputs.environment }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
          - os: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_BUNDLE: ${{ matrix.bundle }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      ZENTRA_DESKTOP_ENV: ${{ needs.prepare.outputs.environment }}
      ZENTRA_API_ORIGIN: ${{ needs.prepare.outputs.environment == 'dev' && (vars.ZENTRA_DEV_API_ORIGIN || 'https://precal.xyehr.cn') || (vars.ZENTRA_API_ORIGIN || 'https://calendar.xyehr.cn') }}
      ZENTRA_UPDATER_PUBLIC_KEY: ${{ vars.ZENTRA_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/calendar-client/src-tauri -> target
          key: ${{ matrix.target }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev xvfb openbox scrot wmctrl x11-utils
      - run: pnpm install --frozen-lockfile
      - name: Build signed updater and installer
        working-directory: apps/calendar-client
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/release-config.mjs
          pnpm tauri build --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLE" --config src-tauri/tauri.release.conf.json
          node scripts/collect-release.mjs
      - name: Installed Linux smoke
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" bash -c 'openbox >/dev/null 2>&1 & node apps/calendar-client/scripts/native-smoke.mjs'
      - name: Installed desktop smoke
        if: runner.os != 'Linux'
        run: node apps/calendar-client/scripts/native-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: apps/calendar-client/release-artifacts/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.target }}
          path: apps/calendar-client/native-smoke-artifacts/*
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      ZENTRA_DESKTOP_ENV: ${{ needs.prepare.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts
      - run: node apps/calendar-client/scripts/publish-release.mjs release-artifacts
