name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BASE_URL: https://calendar.example
      BETTER_AUTH_URL: https://calendar.example
      BETTER_AUTH_SECRET: isolated-build-only-not-a-deployment-secret
      POSTGRES_URL: postgres://build:build@127.0.0.1:5432/build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - run: bun install --frozen-lockfile
      - name: Build workspaces
        run: bun run build

  desktop:
    name: Desktop (${{ matrix.target }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
          - os: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_BUNDLE: ${{ matrix.bundle }}
      ZENTRA_DESKTOP_ENV: dev
      ZENTRA_API_ORIGIN: ${{ vars.ZENTRA_DEV_API_ORIGIN || 'https://precal.xyehr.cn' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/calendar-client/src-tauri -> target
          key: ${{ matrix.target }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf desktop-file-utils xdg-utils
      - run: bun install --frozen-lockfile
      - name: Build unsigned dev installer
        working-directory: apps/calendar-client
        shell: bash
        run: bun run tauri build --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLE" --config src-tauri/tauri.dev.conf.json -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: zentra-dev-${{ matrix.target }}-${{ github.sha }}
          path: |
            apps/calendar-client/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            apps/calendar-client/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/calendar-client/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
