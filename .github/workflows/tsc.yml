name: Workspace Checks

on:
  workflow_dispatch:
    inputs:
      calendar_test_file:
        description: Calendar test path, or tests/calendar for the calendar suite
        required: false
        type: string
      focused_only:
        description: Run only the selected calendar test during a red-green cycle
        required: false
        default: false
        type: boolean
      checkout_ref:
        description: Optional revision to compare against the work branch
        required: false
        type: string
      visual_baseline:
        description: Capture the deterministic 1280px Web calendar reference
        required: false
        default: false
        type: boolean
      desktop_environment:
        description: Optionally build the four desktop installer targets
        required: false
        default: none
        type: choice
        options:
          - none
          - dev
          - production

permissions:
  contents: read

jobs:
  desktop-build:
    if: ${{ inputs.desktop_environment != 'none' && inputs.desktop_environment != '' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
          - os: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TARGET: ${{ matrix.target }}
      ZENTRA_DESKTOP_ENV: ${{ inputs.desktop_environment }}
      ZENTRA_API_ORIGIN: ${{ inputs.desktop_environment == 'dev' && (vars.ZENTRA_DEV_API_ORIGIN || 'https://precal.xyehr.cn') || (vars.ZENTRA_API_ORIGIN || 'https://calendar.xyehr.cn') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Identify checked-out source
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/calendar-client/src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb openbox scrot
      - run: pnpm install --frozen-lockfile
      - name: Build native installer
        shell: bash
        working-directory: apps/calendar-client
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_BUNDLE: ${{ matrix.bundle }}
        run: |
          config_args=()
          if [ "$ZENTRA_DESKTOP_ENV" = "dev" ]; then
            config_args=(--config src-tauri/tauri.dev.conf.json)
          fi
          pnpm tauri build --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLE" "${config_args[@]}"
      - name: Verify window sizing rules
        if: runner.os == 'Linux'
        working-directory: apps/calendar-client/src-tauri
        run: cargo test --locked --release --lib --target x86_64-unknown-linux-gnu
      - name: Verify installed Linux application
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" bash -c 'openbox >"$RUNNER_TEMP/zentra-window-manager.log" 2>&1 & node apps/calendar-client/scripts/native-smoke.mjs'
      - name: Verify installed desktop application
        if: runner.os != 'Linux'
        run: node apps/calendar-client/scripts/native-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-${{ inputs.desktop_environment }}-${{ matrix.target }}-${{ steps.source.outputs.sha }}
          path: apps/calendar-client/native-smoke-artifacts/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: zentra-${{ inputs.desktop_environment }}-${{ matrix.target }}-${{ steps.source.outputs.sha }}
          path: |
            apps/calendar-client/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            apps/calendar-client/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/calendar-client/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
  visual-baseline:
    if: ${{ inputs.visual_baseline }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Identify checked-out source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx playwright@1.63.0 install --with-deps --only-shell chromium
      - name: Start the isolated visual fixture
        run: |
          pnpm exec vite --config tests/calendar/visual/vite.config.ts >"$RUNNER_TEMP/zentra-visual-server.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/zentra-visual-server.log"
          exit 1
      - name: Capture Reference Width
        run: |
          mkdir -p artifacts
          pnpm dlx playwright@1.63.0 screenshot --browser=chromium --viewport-size="1280,900" --timezone=UTC --wait-for-selector='[aria-label="Help"]' --wait-for-timeout=3000 --timeout=60000 http://127.0.0.1:4173/ artifacts/reference-width.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-reference-width-${{ steps.source.outputs.sha }}
          path: |
            artifacts/reference-width.png
            ${{ runner.temp }}/zentra-visual-server.log
  calendar-test:
    if: ${{ inputs.calendar_test_file != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run selected calendar test
        env:
          TEST_FILE: ${{ inputs.calendar_test_file }}
        run: |
          case "$TEST_FILE" in
            tests/calendar|tests/calendar/*.test.ts|tests/calendar/*.test.tsx) ;;
            *) echo "Select a test under tests/calendar"; exit 1 ;;
          esac
          case "$TEST_FILE" in
            *..*) echo "Parent traversal is not allowed"; exit 1 ;;
          esac
          pnpm --filter zentra-calendar exec vitest run "../../$TEST_FILE"
  typecheck:
    if: ${{ !inputs.focused_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm lint:check
      - run: pnpm test
