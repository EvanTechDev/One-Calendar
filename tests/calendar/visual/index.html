<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zentra Calendar — Reference Width baseline</title>
    <script>
      const NativeDate = Date
      window.Date = class extends NativeDate {
        constructor(...args) {
          super(...(args.length ? args : ['2026-10-05T09:00:00.000Z']))
        }
        static now() {
          return NativeDate.parse('2026-10-05T09:00:00.000Z')
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/entry.ts"></script>
  </body>
</html>
